# Levanta todo con un comando: `docker compose up --build`
#   - admin-api: API simulada del administrador (entregada, sin cambios) → http://localhost:4310/docs
#   - backend:   API de Cobrix (NestJS + SQLite)                         → http://localhost:4320/docs
#   - frontend:  panel React servido por Nginx                           → http://localhost:5173
services:
  admin-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      SANDBOX_TODAY: ${SANDBOX_TODAY:-2026-10-13}
    ports:
      - "4310:4310"
    volumes:
      - admin-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/__sim/salud').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "4320"
      ADMIN_API_URL: http://admin-api:4310/api/v1
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-cambia-esta-clave-en-produccion}
      DATABASE_URL: file:/app/data/cobrix.sqlite
      BUSINESS_DATE: ${BUSINESS_DATE:-2026-10-13}
    ports:
      - "4320:4320"
    volumes:
      - cobrix-data:/app/data
    depends_on:
      admin-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4320/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_COBRIX_API_URL: ${VITE_COBRIX_API_URL:-http://localhost:4320}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  admin-data:
  cobrix-data:
